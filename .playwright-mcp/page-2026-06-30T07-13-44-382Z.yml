              - paragraph [ref=e41]:
                - text: 职位描述：
                - text: “理想+”是理想汽车面向全球优秀AI技术人才的校园招聘计划。我们期待你的加入，与理想汽车一起成长、分享收获。通过人工智能技术去改变物理世界的效率和体验，造福我们服务的每一个家庭，以及家庭里的每一位成员。
              - paragraph [ref=e42]:
                - text: 【本岗位的主要工作内容】
                - text: 1. 参与自动驾驶、计算机视觉（CV）、大语言模型（LLM）等AI模型的性能加速工作，协助优化模型训练与推理效率，探索底层硬件与算法的适配方案；
                - text: 2. 协助分析深度学习模型在训练、推理过程中的性能瓶颈，参与CPU/GPU资源调度、内存优化、并行计算效率提升等相关工作；
                - text: 3. 学习并应用深度学习框架（TensorFlow/PyTorch）的性能优化技术，包括计算图优化、算子加速、低精度计算等；
                - text: 4. 跟踪AI系统加速领域的前沿技术（如AI编译器、分布式训练框架），参与技术调研与原型验证；
                - text: 5. 与算法团队、硬件团队协作，参与高性能AI系统的设计与实现，解决模型落地过程中的工程问题。
              - paragraph [ref=e43]:
                - text: 职位要求：
                - text: 1. 计算机科学、人工智能、电子工程等相关专业硕士及以上应届毕业生；
                - text: 2. 具备扎实的编程基础，熟悉C/C++/Python编程语言，有CUDA/OpenCL编程经验者优先；
                - text: 3. 了解深度学习基本原理，熟悉至少一种主流深度学习框架（TensorFlow/PyTorch）的使用；
                - text: 4. 对计算机体系结构、并行计算、高性能计算有一定了解，有相关课程设计或科研项目经验者优先；
                - text: 5. 了解LLVM、TVM等AI编译技术，或参与过模型性能优化、分布式训练相关项目者优先；
                - text: 6. 具备良好的学习能力、逻辑思维和问题分析能力，对AI系统加速技术有浓厚兴趣；
                - text: 7. 有相关领域学术论文发表、竞赛获奖或开源项目贡献者优先。

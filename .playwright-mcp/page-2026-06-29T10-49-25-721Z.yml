              - paragraph [ref=e54]: 理想汽车现有员工超过30000人，本次校招覆盖不同业务部门，共包含九大类职位：整车研发、算法与软件、芯片研发、产品、供应链与智能制造、销售与售后服务、项目管理、设计、职能与综合管理；
              - paragraph [ref=e55]
              - paragraph [ref=e56]:
                - text: l
                - generic [ref=e57]: 多城市覆盖：
              - paragraph [ref=e58]: 理想汽车办公地点分布在全国。我们在北京和上海设有研发总部，同时在杭州也有研发团队，并在常州设有自建工厂。截至2025年4月30日，理想汽车在全国已有500家零售中心，覆盖151个城市；售后维修中心及授权钣喷中心500家，覆盖223个城市。理想汽车已经建成了全国最大的超充网络，已投入使用3000座理想超充站，超充覆盖率行业第一。

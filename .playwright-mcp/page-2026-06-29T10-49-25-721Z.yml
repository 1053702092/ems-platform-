              - paragraph [ref=e42]
              - paragraph [ref=e43]: 理想汽车2026届校园招聘正式开启！
              - paragraph [ref=e44]: 全面覆盖不同业务，总有一个适合你的选择。
              - paragraph [ref=e45]: 期待同有理想的你一起，挑战成长的极限！
              - heading "【关于我们】" [level=2] [ref=e46]: 【关于我们】
              - paragraph [ref=e47]: 理想汽车成立于2015年7月1日，“创造移动的家，创造幸福的家”是我们的使命。
              - paragraph [ref=e48]: 我们通过产品、技术、业务模式的创新突破，为家庭用户打造更安全、更舒适、更便捷的智能电动车。2024年10月18日，理想汽车历时58个月达成百万辆交付里程碑，创下中国豪华车最快达成百万辆纪录。
              - paragraph [ref=e49]: 我们认为，汽车将从工业时代的交通工具，进化成为人工智能时代的空间机器人。我们通过人工智能将物理世界和数字世界进行融合，让有限空间实现无限的延伸。我们要做的不是汽车的智能化，而是人工智能的汽车化，并将推动人工智能普惠到每一个家庭。
              - paragraph [ref=e50]: 我们期待与你，一起挑战成长的极限，共同实现“全球领先的人工智能终端企业”的愿景!
              - paragraph [ref=e51]

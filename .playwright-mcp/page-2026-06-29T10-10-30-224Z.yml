        - generic [ref=e134]:
          - term [ref=e135]: 职位介绍
          - definition [ref=e136]: 工作职责 1、负责动力电池安全预警功能开发、迭代优化，以及市场端动力电池安全运营状态的实时监控与异常响应。 2、负责动力电池运行数据分析及深度挖掘，完成数据清洗、特征工程与数据可视化分析，支撑预警业务研究。 3、负责电池安全预警模型框架搭建及AI算法开发，开展机器学习、深度学习模型设计、训练、验证与迭代优化。 4、负责预警模型在大数据平台部署、多车型扩展应用，提供对应的技术支持与落地保障。 5、负责市场预警专题问题定位、模型线上运维与效果优化，持续提升预警精准度与鲁棒性。 任职资格 1、本科及以上学历，计算机、数学、车辆工程、电气等相关专业毕业优先； 2、1年以上AI算法开发工作经验，拥有机器学习、深度学习模型落地成熟应用案例； 3、熟练使用Python、SQL等语言进行数据处理、模型开发与大数据分析工作； 4、掌握主流大模型相关开发与应用技术，具备大模型微调、Prompt工程、模型部署落地实践经验； 5、扎实掌握经典机器学习算法（分类、聚类、回归、异常检测等）与深度学习算法（CNN、RNN、LSTM、Transformer等），具备独立建模与调优能力； 6、熟悉常用AI算法框架，如TensorFlow、PyTorch、Scikit-learn等，有数据挖掘、时序预测、故障预警项目经验者优先； 7、创新意识及沟通能力强，责任意识与工作主动性高，具备良好的问题分析与工程落地能力。
        - generic [ref=e137]:

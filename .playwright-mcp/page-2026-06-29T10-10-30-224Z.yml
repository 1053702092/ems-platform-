          - definition [ref=e139]: 行业要求：全部行业
      - generic [ref=e140]:
        - heading "公司简介" [level=2] [ref=e141]
        - generic [ref=e142]:
          - generic [ref=e143]: 北京汽车研究总院有限公司（简称“北汽研究总院”）始建于2006年，是北汽集团推进“集团化2.0”建设，构建产品与技术研发能力，实现研发资源整合的关键抓手，是北京汽车自主研发事业的核心板块之一。 2018年1月29日，重新整合后的北汽研究总院加快了实体化运营的步伐，将通过基础研发资源的整合，切实承担起北汽集团的基础技术、通用技术和前沿技术的各个领域整合型研发角色。整合后的北汽研究总院主要负责商品企划、造型设计、试验验证、智能网联等业务板块，新技术研究院是北汽集团集成协同创新、发展智能网联汽车、打造技术层面杀手锏的创新引擎，商品中心、造型中心和试验验证中心致力于统筹北汽集团最优研发资源，打造高水平的基础资源共享服务平台。

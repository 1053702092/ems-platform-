          - definition [ref=e148]: 消费电子类、小家电及小型无人机BMS算法 岗位职责： 1、制定算法验证方案，完成算法仿真测试、电池&整机算法测试要求与全工况精度调优，定位并解决电量估算异常问题 2、前沿算法研究，析锂、膨胀、内短路等算法研究 3 、负责电池 SOC/SOH/SOE/SOP 等电量计核心算法的设计、建模、仿真优化与量产落地 4 、负责完成相关设计方案、测试报告等技术文档撰写 任职要求 1、硕士及3年以上经验，电气工程、控制科学、自动化、车辆工程、电化学等相关专业，能力突出者可放宽至本科 2 、熟练掌握锂离子电池原理与 BMS 系统架构，熟练掌握安时积分、OCV、阻抗跟踪、CEDV电量计等算法，具备电池建模与参数辨识能力 3 、熟练使用相关软件掌握 C 语言，具备嵌入式算法移植能力（软件能力） 4、 熟练掌握算法验证案例（电量计相关优先） 5、工作严谨细致，逻辑清晰，具备较强的问题排查能力与跨部门协作意识 加分项： 1、具备三元、磷酸铁锂、硅碳等多电芯体系算法适配经验优先 2 、有 TI BQ、美信、瑞萨 等电量计芯片应用开发经验优先 3 、有电化学模型、数据驱动融合算法研发经验优先

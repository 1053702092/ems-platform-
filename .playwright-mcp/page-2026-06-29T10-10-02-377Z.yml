        - heading "公司简介" [level=2] [ref=e153]
        - generic [ref=e154]:
          - generic [ref=e155]: 一、公司简介 浙江地芯引力科技有限公司成立于 2019 年 6 月，注册资本 1142.97 万元， 由国家万人计划人才王敏创立。公司专注于消费电子、信息安全等半导体 集成电路细分领域，是一家以科技创新为动力，精通产品开发和市场运营的数 模混合集成电路雏鹰企业。公司座落于杭州市萧山区数字经济新硅谷——杭州 湾信息港，并于深圳、成都分别设立销售服务支持中心及研发分中心。 公司主营产品涵盖电源管理芯片、信息安全芯片、信号链芯片等领域。公司部分产品的市场份额已位居国内前列，与多家行业知名大客户建立稳定合作。现有研发场地约 3000 余平方米。公司核心创始团队具备 15 年以上的芯片设计和产品开发经验。 企业荣誉资质方面， 先后被评为国家重点集成电路设计企业、国家高新技术企业、国家科技型中小 企业、“专精特新”中小企业、准独角兽企业、杭州市雏鹰计划企业、杭州市 专利试点企业、“双软”认证企业、萧山区金凤凰企业等荣誉称号，取得团体标准起草人（USB 充电线通用技术要求）等行业标准化资质荣誉，在消费电子 芯片和信息安全芯片细分领域具备全球隐形独角兽的实力。 产学研校企合作方面，公司已与多家院校成立联合实验室，已开展多项横向项目合作，将本着 “先进科研赋能产业化”的宗旨，进一步围绕数字电源、第三代半导体等方向探索产学研技术成果转化与合作、联合培养人才与定向输送等模式，不断加快 专业人才梯队建设，提升研发创新储备能力。 知识产权方面，地芯引力总计申请200多项知识产权。包括发明专利 164项（授权 81项），实用新型37项（授权 32项），商标 60项（已注册43 项），软件著作权 14 项，集成电路布图设计专有权 28项（授权 28项）， PCT 申请 3件。 二、公司研发技术 公司核心创始团队具备15年以上的芯片设计和产品开发经验。以成熟稳重的80后为骨干、朝气蓬勃的90后为主体。公司为每一位员工量身定制适合的晋升通道及职级体系、广阔的发展空间、多样的人才激励政策等。

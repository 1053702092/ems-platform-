            - generic [ref=e368]:
              - heading "国网新源集团有限公司（国网新源控股有限公司）2026年高校毕业生招聘面试公告（第二批）" [level=1] [ref=e369]
              - generic [ref=e370]:
                - generic [ref=e372]: 二维码
                - generic [ref=e374]:
                  - generic [ref=e375]: 发表时间：2026-03-17 10:10
                  - generic [ref=e376]: 作者：思格教育
              - generic [ref=e379]:
                - paragraph [ref=e380]: 国网新源集团有限公司（国网新源控股有限公司）（以下简称“新源公司”）定于3月21日组织开展2026年高校毕业生招聘面试工作（第二批），现将有关事项通知如下：
                - paragraph [ref=e381]: 一、面试对象
                - paragraph [ref=e382]: 3月17日16:00，新源公司将通过国网招聘平台站内消息、手机短信两种方式向入围面试的考生发送面试通知，未入围面试的考生不再另行通知。接到通知的考生，请按通知要求登陆国网招聘平台，请务必于3月18日24点前，确认参加面试（路径：待办事项->我的消息->点击“参加面试”并确认），不参加的考生也请通过国网招聘平台操作取消，逾期未在国网招聘平台确认的考生视为放弃面试资格。
                - paragraph [ref=e383]: 二、面试安排
                - paragraph [ref=e384]: 1. 面试环节
                - paragraph [ref=e385]: 本批次面试由职业行为风险测评、半结构化面试（主要考察综合能力和专业素质）两个环节组成。未完整参加面试环节的考生，视为放弃。
                - paragraph [ref=e386]: 2. 具体安排
                - paragraph [ref=e387]: 职业行为风险测评：3月18日，测试时长20分钟，考生应在9:00-22:00时间段内完成测试。具体操作方式详见站内信附件《国网新源集团有限公司（国网新源控股有限公司）2026年高校毕业生招聘（第二批）面试指南》。未按时参加的考生视为自行放弃面试资格。
                - paragraph [ref=e388]: 半结构化面试：3月21日，面试采用线下方式进行。面试地点为北京市西城区广安门内大街217号，面试时间为上午8:00-12:00，下午13:00-18:00。请相应时间参考考生携带笔试准考证、身份证，根据通知时间到面试地点签到。考生陪同人员不得进入考试区域。未按时参加的考生视为自行放弃面试资格。
                - paragraph [ref=e389]: 三、面试要求
                - paragraph [ref=e390]: 1.各组考生听从工作人员引导依次参加面试。考生在面试及待考期间应严格执行工作人员要求，保持考场、候考秩序，不得交头接耳、大声喧哗，不得讨论与考试相关的内容，手机、智能手表及智能眼镜等具有录音、录像、通讯功能的各类电子通讯设备务必关闭电源并交由工作人员封存保管，如发现未上交的，视同作弊处理。已面试考生严禁接触候考考生，一经发现将直接取消双方考试资格。
                - paragraph [ref=e391]: 2.面试结束后，考生须对面试试题保密，不得外传外泄。
                - paragraph [ref=e392]: 四、其他说明
                - paragraph [ref=e393]: 1.请考生参加面试前登陆国网招聘平台，确认已上传学籍验证报告（路径：附件/学籍认证），并已准确填写有效期内的学籍验证码，否则将影响录取资格。
                - paragraph [ref=e394]: 2.请考生确保在国网招聘平台中登记的手机号码通讯畅通、邮箱地址准确，因通讯不畅或邮箱登记错误未能收到相关通知而影响后续入职的，由考生自行承担责任。
                - paragraph [ref=e395]: 3.新源公司不举办也不委托任何机构、个人举办任何形式的考前培训班，任何针对新源公司招聘面试的辅导班、考试教材、复习资料，均与新源公司无关。
                - paragraph [ref=e396]: 五、联系方式
                - paragraph [ref=e397]: 咨询电话：010-51965299（仅招聘期间工作时间）。
                - paragraph [ref=e398]: 咨询电话仅在报名考试期间受理应聘毕业生本人咨询，接听时间为工作日9:00-12:00、14:00-17:00。
                - paragraph [ref=e399]: 国网新源集团有限公司
                - paragraph [ref=e400]: （国网新源控股有限公司）
                - paragraph [ref=e401]: 2026年3月17日
                - paragraph [ref=e402]

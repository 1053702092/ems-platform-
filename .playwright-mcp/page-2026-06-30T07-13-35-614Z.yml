              - paragraph [ref=e42]:
                - text: 职位要求：
                - text: 1. 硕士及以上学历，机器学习、强化学习、计算机科学、自动化等相关专业；
                - text: 2. 扎实的强化学习理论基础，熟悉主流RL算法（PPO、SAC、TD3、IQL等）及其应用；
                - text: 3. 熟练掌握Python、C++编程语言，熟悉PyTorch等深度学习框架，有分布式训练经验；
                - text: 4. 对大规模强化学习、策略优化、模仿学习等有深入理解和实践经验；
                - text: 5. 具有优秀的分析和解决问题能力，自驱性强，能够独立推进研究项目。
                - text: 【具备以下条件优先】
                - text: 1. 在NeurIPS/ICLR/ICML/ICRA/CoRL/RSS等顶级会议发表论文者优先；
                - text: 2. 有自动驾驶、机器人、游戏AI等领域的强化学习应用经验者优先；
                - text: 3. 有仿真平台（CARLA、NVIDIA Isaac、MuJoCo等）开发或使用经验者优先；
                - text: 4. 有Model-based RL、World Model、Offline RL、Sim2real等研究经验者优先；
                - text: 5. 有大规模分布式训练系统开发经验，熟悉Ray、Kubernetes等工具者优先；
                - text: 6. 维护过重量级开源项目或在RL相关竞赛中获奖者优先；
                - text: 7. 有实车/实机调试经验，了解传感器栈、控制闭环者优先。

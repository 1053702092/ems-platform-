                - text: 4. 探索模仿学习、逆强化学习、Scalable Oversight等技术，提升策略学习效率与泛化能力；
                - text: 5. 与世界模型团队协作，利用学习式仿真环境进行策略训练与验证，推动sim2real迁移；

            - text: 中国南方电网有限责任公司（简称“中国南方电网”，英文缩写：CSG）成立于2002年12月29日，是中央管理的关系国家安全、国民经济命脉的国有重要骨干企业。公司负责投资、建设和经营管理南方区域电网，参与投资、建设和经营相关跨区域输变电和联网工程，为广东、广西、云南、贵州、海南五省区和港澳地区提供电力供应服务保障，以输配电业务为核心，协同发展新兴业务、国际业务、产业金融、共享服务等，共五大战略单元。

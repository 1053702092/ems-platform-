            - heading "Company Profile" [level=2] [ref=e53]
            - paragraph [ref=e54]: "Li Auto Inc. is a leader in China’s new energy vehicle market. The Company designs, develops, manufactures, and sells premium smart electric vehicles. Its mission is: Be Proactive, Change the World. Through innovations in product, technology, and business model, the Company provides families with safe, convenient, and comfortable products and services. Li Auto is a pioneer in successfully commercializing extended-range electric vehicles in China. While firmly advancing along this technological route, it builds platforms for battery electric vehicles in parallel. The Company leverages technology to create value for users. It concentrates its in-house development efforts on proprietary range extension systems, innovative electric vehicle technologies, and smart vehicle solutions. The Company started volume production in November 2019. It offers high-tech flagship family MPVs, Li L series extended-range electric SUVs, and Li i series battery electric SUVs. The Company will continue to expand its product lineup to target a broader user base."

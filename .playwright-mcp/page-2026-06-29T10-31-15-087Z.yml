        - heading "公司简介" [level=2] [ref=e73]
        - generic [ref=e74]:
          - generic [ref=e75]: 晶科能源股份有限公司（简称“晶科能源”，股票代码：688223）是一家全球知名、**创新力的太阳能科技企业。秉承“改变能源结构，承担未来责任”的使命，公司战略性布局光伏产业链核心环节，聚焦光伏产品一体化研发制造和清洁能源整体解决方案提供，销量**全球主流光伏市场。 晶科能源的产品服务于全球160余个国家和地区的3000余家户，多年位列全球组件出货量**。截至2022年12月，公司组件出货量累计超过130GW。公司是B20等多个国际框架下的行业意见**，同时也于2019年加入RE100绿色倡议。晶科能源在行业中率先建立了从硅片、电池片到组件生产的“垂直一体化”产能，在中国、马来西亚、越南、美国共拥有14个全球化生产基地。截至2022年末，公司单晶硅片、电池、组件产能分别达到65GW、55GW和70GW，并建立了行业*大规模的N型电池产能共35GW。公司现有研发和技术人员1,000 余名，取得“国家企业技术中心”、“国家技术创新示范企业”、“制造业单项**”等多项殊荣，主导制定了IEC等多项国际国内行业标准，不断拓展光伏技术的多元化规模应用场景，积极布局光伏建筑一体化、光伏制氢、储能等领域，着力打造新能源生态圈。 晶科能源于2022年在上海证券交易所科创板上市，其间接控股股东晶科能源控股有限公司于2010年在纽约证券交易所上市。

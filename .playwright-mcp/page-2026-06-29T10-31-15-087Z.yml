          - definition [ref=e67]: 岗位职责： 1、负责电池管理系统的算法设计工作，包括SOC/SOH/CEU/BCU等算法； 2、负责电池管理系统的实车适配工作，包括电池系统和车主使用习惯等； 3、负责电池管理系统的UPT/fault/维修等方面的工作； 4、协调内外部资源，推进算法开发及其验证工作。 岗位要求： 1、本科及以上学历，5-10年以上BMS算法开发相关经验； 2、熟悉常用的电池管理算法，如SCEU算法、BEC算法、HOPV算法等； 3、有电池管理系统的实车适配经验； 4、有电池管理系统CAN(ControllerAreaNetwork)开发经验； 5、熟悉Matlab/Simulink等平台。

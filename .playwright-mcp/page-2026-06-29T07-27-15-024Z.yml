                    - generic [ref=e319] [cursor=pointer]:
                      - generic [ref=e323]:
                        - generic:
                          - paragraph: 我大宝五岁，小宝1岁，切身经历过夜不能寐的阶段，从自己个人经历的角度分析一下吧。
                          - paragraph: 9个月宝宝半夜哭闹，可能是这些原因：
                          - paragraph: 1、睡前没吃饱。我家大宝就很厌食挑食，经常晚饭不认真吃，夜里有时候就会饿醒了，翻来覆去闹腾人。小宝1岁，如果睡前没喂饱，夜里会哭闹的比较严重，当然，我家小宝太小了，基本上每天晚上都会醒很多次。可怜老母亲，很久没睡整夜觉了。
                          - paragraph: 2、缺钙。9个月宝宝身体长得快，有可能缺钙，及时给宝宝补补钙吧。我记得我弟弟小时候，就因为身高长得太快，夜里睡不着，腿疼。
                          - paragraph: 3、惊吓。有可能宝宝近期看了什么恐怖的动画片、电影什么的，有点受到惊吓了。我家大宝看了千与千寻，被里面的无脸男吓得好几天睡不好。
                          - paragraph: 4、受凉。最近季节变化，温差比较大，孩子很容易受凉，受凉的小孩夜里容易睡不好。买个那个肚脐贴，贴肚脐上面，会好点。

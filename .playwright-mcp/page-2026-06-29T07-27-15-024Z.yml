                        - paragraph [ref=e179]: 干拢9个月宝宝夜间睡眠的原因可能有如下几点！
                        - paragraph [ref=e180]: 1、环境。光线、温度、噪声、湿度、以及睡衣、寝具是否合适？都要认真检查一下。
                        - paragraph [ref=e181]: 2、是否有及时更换纸尿裤！
                        - paragraph [ref=e182]:
                          - text: 3、检查是否有因为喂养不当，而导致的腹部不适。因为九个月的孩子是处在，正式
                          - link "辅食添加" [ref=e184] [cursor=pointer]:
                            - /url: https://zhida.zhihu.com/search?content_id=567253963&content_type=Answer&match_order=1&q=%E8%BE%85%E9%A3%9F%E6%B7%BB%E5%8A%A0&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODI4OTA4MzIsInEiOiLovoXpo5_mt7vliqAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjo1NjcyNTM5NjMsImNvbnRlbnRfdHlwZSI6IkFuc3dlciIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.WU0RJXvlpK3nYJ_Aaic32oM_A6ap1WjA0WsYre1izkQ&zhida_source=entity
                            - text: 辅食添加
                            - img [ref=e185]
                          - text: 的初期，有可能家长对于辅食添加过于着急，而添加的过多或过杂，都会引起孩子腹部不适感。
                        - paragraph [ref=e187]: 4、缺乏维生素D。
                        - paragraph [ref=e188]: 其他原因还可能有，例如蚊虫叮咬。白天过于兴奋。饮水过多等等。但无论是哪种原因，都需要家长静下心来，不要着急，耐心轻柔的安抚孩子！千万不要孩子闹你就急，从而导致恶性循环。
